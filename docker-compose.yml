version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clausenova_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-clausenova_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clausenova_secret}
      POSTGRES_DB: ${DB_NAME:-clausenova_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d

  ollama:
    image: ollama/ollama:latest
    container_name: clausenova_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clausenova_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_USER: ${DB_USER:-clausenova_user}
      DB_PASSWORD: ${DB_PASSWORD:-clausenova_secret}
      DB_NAME: ${DB_NAME:-clausenova_db}
      DB_PORT: 5432
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - postgres
      - ollama
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clausenova_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  ollama_data:
